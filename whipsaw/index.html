<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WHIPSAW</title>
  <style>
    :root { --accent: #19d3ff; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #05060a; }
    canvas { display: block; }

    #hud {
      position: fixed; inset: 0; pointer-events: none;
      font-family: "SF Mono", "Consolas", monospace; color: #cfeaff;
      text-shadow: 0 0 8px rgba(25, 211, 255, 0.4);
    }
    #timers { position: absolute; top: 18px; left: 20px; }
    #timers .cur { font-size: 46px; font-weight: 700; letter-spacing: 1px; }
    #timers .lbl { font-size: 11px; letter-spacing: 2px; opacity: 0.45; margin-top: 8px; }
    #board .row { font-size: 15px; opacity: 0.7; margin-top: 2px; font-variant-numeric: tabular-nums; }
    #board .rk { color: var(--accent); display: inline-block; width: 1.5em; }
    #board .row.fresh { opacity: 1; color: #fff; text-shadow: 0 0 10px rgba(25, 211, 255, 0.7); }
    #board .row.fresh .rk { color: #fff; }

    #speed { position: absolute; bottom: 20px; right: 24px; text-align: right; }
    #speed .v { font-size: 40px; font-weight: 700; color: var(--accent); }
    #speed .u { font-size: 13px; opacity: 0.7; }

    #meta { position: absolute; bottom: 18px; left: 20px; font-size: 12px; opacity: 0.6; line-height: 1.6; }
    #meta b { color: var(--accent); }

    #flash {
      position: absolute; top: 38%; left: 50%; transform: translate(-50%, -50%);
      font-size: 32px; font-weight: 700; color: #fff; opacity: 0;
      transition: opacity 0.25s; text-align: center;
    }

    /* Title wordmark — shown centred at the line, fades as you launch. */
    #title {
      position: absolute; top: 46%; left: 50%; transform: translate(-50%, -50%);
      font-size: 76px; font-weight: 700; letter-spacing: 16px; padding-left: 16px;
      color: rgba(207, 234, 255, 0.82); text-shadow: 0 0 26px rgba(25, 211, 255, 0.55);
      opacity: 0; transition: opacity 0.7s ease; pointer-events: none; white-space: nowrap;
    }

    /* Red edge glow shown while scraping a wall. */
    .wallglow {
      position: absolute; top: 0; bottom: 0; width: 18%; opacity: 0;
      pointer-events: none; transition: opacity 0.06s linear;
    }
    #wallL { left: 0;  background: linear-gradient(to right, rgba(255,54,54,0.55), transparent); }
    #wallR { right: 0; background: linear-gradient(to left,  rgba(255,54,54,0.55), transparent); }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.169.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="hud">
    <div id="wallL" class="wallglow"></div>
    <div id="wallR" class="wallglow"></div>
    <div id="timers">
      <div class="cur" id="curTime">0:00.000</div>
      <div class="lbl">FASTEST</div>
      <div id="board"></div>
    </div>
    <div id="speed"><span class="v" id="kph">0</span> <span class="u">KM/H</span></div>
    <div id="meta">
      SEED <b id="seed">--</b><br />
      W/↑ throttle · S/↓ brake · A/D ←/→ steer<br />
      R restart · N new track · M mute
    </div>
    <div id="title">WHIPSAW</div>
    <div id="flash"></div>
  </div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
